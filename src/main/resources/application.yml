server:
  port: 8081
spring:
  # Spring AI 配置 (以阿里云百炼为例，通常兼容 OpenAI 格式)
  ai:
    openai:
      api-key: sk-571293b31f4d43efb883baef316b0b11
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: qwen-turbo # 你想用的模型
          temperature: 0.1 # 温度越低随机性越低 内容审核不需要高随机性
          response-format:
            type: json_object # 响应格式 让模型返回 JSON 而不是返回markdown
      client:
        connect-timeout: 10000  # 10秒连接
        read-timeout: 30000      # 30秒读取
  # 自定义审核配置
  audit:
    max-retry-times: 3 # 最大重试次数

#  devtools:
#    restart:
#      enabled: false
#      additional-paths: src/main/java
#      exclude: static/**,templates/**
  application:
    name: thumb-backend
  mvc:
    servlet:
      path: /api
  # Tomcat 线程池优化
  tomcat:
    threads:
      max: 1000
      min-spare: 200
    max-connections: 10000
    accept-count: 1000
  data:
    redis:
      database: 0
      host: 192.168.192.130
      password:
      timeout: 3000
      port: 6379
      lettuce:
        pool:
          max-active: 500
          max-idle: 100
          min-idle: 50
          max-wait: 3000ms
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/nexus_ai?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 600000
  session:
    timeout: 86400s
    redis:
      serializer-type: json

mybatis-plus:
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
    rewriteBatchedStatements: true

# ⬇️ logging 必须是顶层，不能在 spring 里面
logging:
  level:
    org.springframework.web.client: INFO
    org.springframework.web: INFO


rocketmq:
  name-server: 192.168.192.130:9876  # 你的Linux服务器IP
  producer:
    group: nexus-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

# 审核渐进式配置（改这里控制上线节奏，不用改代码）
audit:
  sampling:
    rate: 30        # 采样率：第1周30，第2周20，稳定后5
  shadow:
    mode: true      # true=影子模式（只记录），false=正式复用
  simhash:
    threshold: 2    # 海明距离阈值：2=严格，3=宽松
